[project]
name = "projectb"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn==0.51.0",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "openai==2.46.0",
    "pypdf==6.14.2",
    "pypdfium2==5.12.1",
    "Pillow==12.3.0",
    "keyring==25.7.0",
    "tzdata==2026.3",
    "python-multipart==0.0.32",
    "psutil==7.2.2",
]

[dependency-groups]
test = [
    "httpx2==2.7.0",
    "pytest==9.1.1",
]
quality = [
    "ruff==0.15.22",
    "mypy==2.3.0",
    "types-psutil==7.2.2.20260518",
]
build = [
    "pyinstaller==6.21.0",
]

[tool.pytest.ini_options]
markers = [
    "windows: exercises a disposable Windows-only integration",
]
