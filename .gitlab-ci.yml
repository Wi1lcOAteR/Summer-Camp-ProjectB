stages:
  - test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - when: never

unit-test:
  stage: test
  timeout: 10m
  image:
    name: mcr.microsoft.com/powershell:7.5-ubuntu-24.04@sha256:042240d57ec9e47e511033b92625a8d95875ee5860af3015992c248b58a8be81
    entrypoint: [""]
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates
    - git --version
    - pwsh --version
    - pwsh -NoProfile -File scripts/tests/bootstrap_scanner_contract.ps1
    - pwsh -NoProfile -File scripts/tests/ci_seed_contract.ps1
    - pwsh -NoProfile -File scripts/bootstrap_scan_credentials.ps1 -Tracked

backend:
  stage: test
  timeout: 20m
  image: python:3.14.6-slim-bookworm@sha256:f70215e5dbe2a47dee6d23f9c6d358bf3c148f59cce2fd165b61118e9d80f2bb
  script:
    - python --version
    - python -m pip install --require-hashes -r requirements.linux-ci.lock
    - python scripts/test_all.py --backend

frontend:
  stage: test
  timeout: 20m
  image: node:24.18.0-bookworm-slim@sha256:d45d78e7929b46875bbd4e29bea672d5bc48186c6c3588306521c815e78352d6
  script:
    - node --version
    - npm --version
    - cd frontend
    - npm ci --ignore-scripts
    - npm exec -- vitest run
    - npm exec -- tsc --noEmit
    - npm exec -- vite build

oci-package:
  stage: test
  timeout: 30m
  variables:
    DOCKER_BUILDKIT: "1"
  tags:
    - projectb-docker-linux-amd64
  script:
    - test "$(docker version --format '{{.Server.Version}}')" = "29.1.2"
    - test "$(docker info --format '{{.OSType}}')" = "linux"
    - test "$(docker info --format '{{.Architecture}}')" = "x86_64"
    - test "$(docker info --format '{{.MemTotal}}')" -ge 4294967296
    - test "$DOCKER_BUILDKIT" = "1"
    - test "${PROJECTB_RUNNER_PRIVILEGED:-unknown}" = "false"
    - test "${PROJECTB_RUNNER_HOST_MOUNTS:-unknown}" = "none"
    - docker buildx version
    - docker info --format '{{.SecurityOptions}}' | grep -F 'name=seccomp'
    - test ! -e /host/etc/shadow
    - test ! -e /run/host/etc/shadow
    - IMAGE_TAG="projectb-demo:${CI_COMMIT_SHA}-${CI_JOB_ID}"
    - docker build --platform linux/amd64 --file packaging/oci/Dockerfile --tag "$IMAGE_TAG" .
    - test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE_TAG")" = "amd64"
    - test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE_TAG")" = "10001:10001"
    - docker run --rm --entrypoint /bin/sh "$IMAGE_TAG" -c 'test -s /opt/projectb/licenses/sbom.spdx.json && test -s /opt/projectb/licenses/THIRD_PARTY_NOTICES.md && test -s /opt/projectb/licenses/OCI_THIRD_PARTY_NOTICES.md && test -s /opt/projectb/licenses/debian-packages.tsv'
    - CONTAINER_NAME="projectb-demo-ci-${CI_JOB_ID}"
    - HOST_PORT="$((20000 + CI_JOB_ID % 10000))"
    - docker run -d --rm --read-only --tmpfs /tmp/projectb-demo:rw,size=64m -e PROJECTB_DEMO_LOCAL_SMOKE=1 -p 127.0.0.1:${HOST_PORT}:7860 --name "$CONTAINER_NAME" "$IMAGE_TAG"
    - pwsh -NoProfile -File packaging/oci/smoke_test.ps1 -Container "$CONTAINER_NAME" -Image "$IMAGE_TAG" -BaseUrl "http://127.0.0.1:${HOST_PORT}"
  after_script:
    - |
      CONTAINER_NAME="projectb-demo-ci-${CI_JOB_ID}"
      IMAGE_TAG="projectb-demo:${CI_COMMIT_SHA}-${CI_JOB_ID}"
      if docker inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
        docker rm -f "$CONTAINER_NAME"
      fi
      if docker image inspect "$IMAGE_TAG" >/dev/null 2>&1; then
        docker image rm "$IMAGE_TAG"
      fi
