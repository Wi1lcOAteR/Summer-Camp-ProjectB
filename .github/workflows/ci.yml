name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/powershell:7.5-ubuntu-24.04@sha256:042240d57ec9e47e511033b92625a8d95875ee5860af3015992c248b58a8be81
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install scanner prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Record versions
        run: |
          git --version
          pwsh --version
      - name: Run bootstrap scanner contract
        run: pwsh -NoProfile -File scripts/tests/bootstrap_scanner_contract.ps1
      - name: Verify CI seed contract
        run: pwsh -NoProfile -File scripts/tests/ci_seed_contract.ps1
      - name: Scan tracked worktree
        run: pwsh -NoProfile -File scripts/bootstrap_scan_credentials.ps1 -Tracked

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: python:3.14.6-slim-bookworm@sha256:f70215e5dbe2a47dee6d23f9c6d358bf3c148f59cce2fd165b61118e9d80f2bb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record Python version
        run: python --version
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.linux-ci.lock
      - name: Run current backend suite
        shell: sh
        run: python scripts/test_all.py --backend

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: node:24.18.0-bookworm-slim@sha256:d45d78e7929b46875bbd4e29bea672d5bc48186c6c3588306521c815e78352d6
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: .
      - name: Record Node versions
        run: |
          node --version
          npm --version
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run all frontend tests
        run: npm exec -- vitest run
      - name: Type-check frontend
        run: npm exec -- tsc --noEmit
      - name: Build frontend
        run: npm exec -- vite build

  windows-package:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.14.6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Record Windows tool versions
        shell: pwsh
        run: |
          python --version
          node --version
          npm --version
      - name: Install locked Windows dependencies
        shell: pwsh
        run: python -m pip install --require-hashes -r backend/requirements-windows-x64.lock
      - name: Build locked frontend
        shell: pwsh
        run: |
          npm.cmd --prefix frontend ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows distribution contract
        shell: pwsh
        run: python -m pytest backend/tests/distribution/test_windows_contract.py -q
      - name: Build single-file artifact
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/windows/build.ps1 -Python python -Output dist/ProjectB.exe
      - name: Scan and hash runner-local artifact
        shell: pwsh
        run: |
          python scripts/scan_credentials.py --path dist/ProjectB.exe
          Get-FileHash -Algorithm SHA256 -LiteralPath dist/ProjectB.exe

  oci-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: OCI preflight
        shell: bash
        run: |
          set -eu
          test "$(docker version --format '{{.Server.Version}}')" != ""
          docker info --format '{{.Driver}} {{.OSType}} {{.Architecture}}'
          test "$(docker info --format '{{.OSType}}')" = "linux"
          test "$(docker info --format '{{.Architecture}}')" = "x86_64"
          test "$(docker info --format '{{.MemTotal}}')" -ge 4294967296
          test "$(docker info --format '{{.SecurityOptions}}')" != "[]"
      - name: Build linux amd64 demo image
        shell: bash
        run: docker build --platform linux/amd64 --file packaging/oci/Dockerfile --tag projectb-demo:ci .
      - name: Inspect image contract
        shell: bash
        run: |
          set -eu
          test "$(docker image inspect --format '{{.Architecture}}' projectb-demo:ci)" = "amd64"
          test "$(docker image inspect --format '{{.Config.User}}' projectb-demo:ci)" = "10001:10001"
          docker run --rm --entrypoint /bin/sh projectb-demo:ci -c 'test -s /opt/projectb/licenses/sbom.spdx.json && test -s /opt/projectb/licenses/THIRD_PARTY_NOTICES.md && test -s /opt/projectb/licenses/OCI_THIRD_PARTY_NOTICES.md && test -s /opt/projectb/licenses/debian-packages.tsv'
      - name: Run local OCI smoke
        shell: bash
        run: |
          set -eu
          cleanup() {
            if docker inspect projectb-demo-ci >/dev/null 2>&1; then
              docker rm -f projectb-demo-ci >/dev/null
            fi
          }
          trap cleanup EXIT
          docker run -d --rm --read-only --tmpfs /tmp/projectb-demo:rw,size=64m \
            -e PROJECTB_DEMO_LOCAL_SMOKE=1 -p 127.0.0.1:7860:7860 \
            --name projectb-demo-ci projectb-demo:ci
          pwsh -NoProfile -File packaging/oci/smoke_test.ps1 -Container projectb-demo-ci -Image projectb-demo:ci -BaseUrl http://127.0.0.1:7860
